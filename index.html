<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SF street sweeping by day</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <label for="day-select">Street cleaning day</label>
        <select id="day-select" aria-label="Day of week"></select>
      </div>
      <p class="disclaimer">
        <strong>▲</strong> arrows show where cleaning runs on the day you pick
        (defaults to today). Tap near a street or use the list for details. On
        <strong>Market St</strong>, arrows align ~NE / ~SW from block face where
        the data allows. Verify signs.
      </p>
      <div id="status" class="status" role="status"></div>
      <div class="map-wrap">
        <div id="map" role="application" aria-label="Street cleaning map"></div>
      </div>
      <section class="list-panel" aria-label="Street list">
        <header><span id="list-count"></span></header>
        <ul id="segment-list"></ul>
      </section>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
